_config:
  basic:
    $description: |-
      基础设置
    cacheHours: |-
      <p>抽奖开奖后，抽奖记录的保留时长（小时）。</p>
      <p>超过该时长的记录会被自动清理，默认 72 小时。</p>
    defaultTimeOffset: |-
      <p>未设置时区的用户默认使用的时区偏移量。</p>
      <p>填写本地时间与 UTC 时间之间的差值，例如 <code>+8</code>、<code>-9:30</code>、<code>-00:25:21</code>。</p>
  permission:
    $description: |-
      权限设置
    authorityCreate: |-
      <p>创建抽奖所需的最低权限等级，默认为 1（普通用户）。</p>
      <p>Koishi 权限等级：<code>0</code> 封禁、<code>1</code> 普通用户、<code>3</code> 管理员、<code>4</code> 超级管理员，可用 <code>admin user.authorize &lt;等级&gt;</code> 指令或控制台的用户页面调整。</p>
      <p>群主与群管理员始终可以创建抽奖。</p>
    authorityManage: |-
      <p>管理<b>他人</b>抽奖（删除抽奖、手动开奖、管理提醒器）所需的最低权限等级，默认为 3（管理员）。</p>
      <p>抽奖的创建者始终可以管理自己的抽奖。</p>
    allowGuildAdminDelete: |-
      <p>允许<b>群主与群管理员</b>删除本群的抽奖。</p>
      <p>关闭后，只有创建者与达到管理等级的用户可以删除。</p>
    allowGuildAdminEnd: |-
      <p>允许<b>群主与群管理员</b>对本群的抽奖手动开奖。</p>
      <p>关闭后，只有创建者与达到管理等级的用户可以开奖。</p>
  join:
    $description: |-
      参与条件
    minGroupLevel: |-
      <p>参与抽奖所需的最低<b>群聊等级</b>（QQ 群内等级，1~100）。</p>
      <p>填 <code>0</code> 表示不限制；例如填 <code>40</code>，则只有 40 级及以上的人能参加。</p>
      <p>数据来自 OneBot 的 <code>get_group_member_info</code>（<code>level</code> 字段，即 QQ 的群聊等级）。</p>
    minActiveDays: |-
      <p>要求参与者最近 N 天内在本群发过言，填 <code>0</code> 表示不限制。</p>
      <p>数据来自 <code>get_group_member_info</code> 的 <code>last_sent_time</code>。它不依赖 QQ 网页接口，比下方的互动标识稳定，建议作为兜底条件。</p>
    requiredHonors:
      $description: |-
        <p>要求参与者持有指定的 QQ 群<b>互动标识</b>（群荣誉），可多选，留空表示不限制。</p>
        <p>数据来自 OneBot 的 <code>get_group_honor_info</code>：</p>
        <ul>
          <li><b>群聊之火：</b>连续发言 7 天（<code>performer_list</code>）</li>
          <li><b>群聊炽焰：</b>连续发言 30 天（<code>legend_list</code>）</li>
          <li><b>龙王：</b>昨日群聊最活跃（<code>talkative_list</code>）</li>
        </ul>
        <p>持有炽焰的人不会再出现在火列表里，插件已自动兼容（炽焰视为满足「连续 7 天」）。该接口走 qun.qq.com 网页接口，较慢且可能失败，结果按「缓存时长」缓存。</p>
      $inner:
        - 群聊之火（连续发言 7 天）
        - 群聊炽焰（连续发言 30 天）
        - 龙王（昨日群聊最活跃）
    honorMode:
      $description: |-
        勾选多个互动标识时，是满足任意一个即可，还是必须全部满足。
      $inner:
        - 满足任意一个
        - 必须全部满足
    onFetchError:
      $description: |-
        <p>取不到群成员 / 群荣誉数据时的策略（QQ 接口超时、Cookie 失效等）。</p>
        <p><b>放行：</b>跳过取不到的条件，允许参加（推荐，避免误伤正常用户）；<b>拒绝：</b>提示用户稍后再试。</p>
      $inner:
        - 放行
        - 拒绝
    cacheMinutes: |-
      群荣誉数据的缓存时长（分钟），填 <code>0</code> 表示每次都重新获取。
  remind:
    $description: |-
      提醒设置
    defaultReminders:
      $description: |-
        <p>新建抽奖时默认启用的提醒器。</p>
        <p><b>type：</b>提醒器类型</p>
        <ul>
          <li><b>定时提醒器：</b>在指定时刻提醒一次</li>
          <li><b>结束前提醒器：</b>抽奖结束前一定时间提醒一次</li>
        </ul>
        <p><b>value：</b>时间或间隔，格式为 <b>年-月-日-时-分</b>（未用到的位填 0）</p>
      value: |-
        格式：年-月-日-时-分
      type:
        $inner:
          - 定时提醒器
          - 结束前提醒器
commands:
  timeout: |-
    输入超时
  giveaway:
    description: |-
      Giveaway 抽奖功能
  giveaway.help:
    description: |-
      显示 Giveaway 帮助信息
    messages:
      help: |-
        <p>帮助文档：</p>
        <a>https://github.com/firedrakeovo/koishi-plugin-giveaway</a>
  giveaway.channel:
    description: |-
      获取当前频道的频道id
    messages:
      result: |-
        当前频道id为：{0}
  giveaway.add:
    description: |-
     交互式地创建一个抽奖
    messages:
      noAuth: |-
        你没有权限创建抽奖！
      defaultTitle: |-
        {0} 的抽奖
      defaultDescription: |-
        {0} 的抽奖
      success: |-
        创建抽奖成功，编号为 {0}
      title: |-
        <p>请输入抽奖的标题：</p>
        <p>- 回复 n 使用默认内容：{0} 的抽奖</p>
        <p>- 回复 q 取消本次创建</p>
      description: |-
        <p>请输入抽奖的描述：</p>
        <p>- 回复 n 使用默认内容：{0} 的抽奖</p>
        <p>- 回复 undo 回到上一步</p>
        <p>- 回复 q 取消本次创建</p>
      prize: |-
        <p>请输入你要抽的奖品：</p>
        <p>格式：奖品名称*数量 (留空为1)，每行视为一个独立奖品。</p>
        <p>- 回复 undo 回到上一步</p>
        <p>- 回复 q 取消本次创建</p>
      prizeFast: |-
        <p>请输入你要抽的奖品：</p>
        <p>格式：奖品名称*数量 (留空为1)，每行视为一个独立奖品。</p>
        <p>- 回复 q 取消本次创建</p>
      autoEnd: |-
        <p>请输入自动开奖的时间：</p>
        <p>格式：年-月-日-时-分</p>
        <p>当前时区：{0}</p>
        <p>- 回复 n 则不使用自动开奖</p>
        <p>- 回复 undo 回到上一步</p>
        <p>- 回复 q 取消本次创建</p>
      timeError: |-
        时间格式错误，请重新创建！
      type: |-
        <p>请选择自动开奖的抽奖类型，仅需回复数字：</p>
        <p>0：中奖人可重复</p>
        <p>1：中奖人不可重复</p>
        <p>- 回复 n 使用默认类型：1</p>
        <p>- 回复 undo 回到上一步</p>
        <p>- 回复 q 取消本次创建</p>
      typeError: |-
        抽奖类型错误，请重新创建！
      joinKey: |-
        <p>请输入加入抽奖的口令，用户可以直接发送口令来加入抽奖：</p>
        <p>- 回复 n 则不使用加入口令</p>
        <p>- 回复 undo 回到上一步</p>
        <p>- 回复 q 取消本次创建</p>
      quit: |-
        已取消本次创建。
  giveaway.delete:
    description: |-
      手动删除一个抽奖
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
      noAuth: |-
        你没有权限删除该抽奖！
      success: |-
        删除了抽奖 {0}
  giveaway.end:
    description: |-
      手动进行开奖
    messages:
      wait:
        header: |-
          <p>当前你创建的抽奖如下：</p>
        body:
          rollList: |-
            <p>[{roll_code}] {title}</p>
        footer: |-
          <p>请输入要开奖的抽奖编号：</p>
      noAuth: |-
        你没有权限进行开奖！
      isEnd: |-
        该抽奖已开奖！
      notFound: |-
        没有找到该抽奖！
  giveaway.list:
    description: |-
      查询指定频道内的抽奖
  giveaway.detail:
    description: |-
      查询指定抽奖的详细描述
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
  giveaway.member:
    description: |-
      查询指定抽奖的参与成员
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
  giveaway.join:
    description: |-
      加入指定的抽奖
    messages:
      failed: |-
        找不到此抽奖！
      empty: |-
        请输入抽奖编号！
  giveaway.quit:
    description: |-
      退出指定的抽奖
    messages:
      failed: |-
        找不到此抽奖！
      empty: |-
        请输入抽奖编号！
  giveaway.time:
    description: |-
      修改时区
    messages:
      inValidFormat: |-
        请输入正确的时区偏移值格式！
      noAuth: |-
        你没有修改的权限！
      empty: |-
        无
      selected: |-
        使用此时区
      result: |-
        <p>当前时区设置：</p>
        <p> - 频道时区：{0}</p>
        <p> - 你的时区：{1}</p>
        <p> - 默认时区：{2}</p>
      success:
        channel: |-
          修改成功，频道当前的时区为 UTC{0}。
        user: |-
          修改成功，你当前的时区为 UTC{0}。
        defaultChannel: |-
          已清除频道时区设置
        defaultUser: |-
          已清除你的时区设置
  giveaway.locale:
    description: |-
      修改语言偏好
    messages:
      inValidFormat: |-
        请输入正确的语言偏好格式！
      noAuth: |-
        你没有修改的权限！
      empty: |-
        无
      selected: |-
        使用此语言偏好
      result: |-
        <p>当前语言偏好设置：</p>
        <p> - 频道语言偏好：{0}</p>
        <p> - 你的语言偏好：{1}</p>
        <p> - 默认语言偏好：{2}</p>
      success:
        channel: |-
          修改成功，频道当前的语言偏好为 {0}。
        user: |-
          修改成功，你当前的语言偏好为 {0}。
        defaultChannel: |-
          已清除频道语言偏好设置
        defaultUser: |-
          已清除你的语言偏好设置
  giveaway.remind:
    description: |-
      查询抽奖启用的提醒
    messages:
      notFound: |-
        没有找到该抽奖！

  giveaway.reminder:
    description: |-
      Giveaway 提醒功能
  giveaway.reminder.add:
    description: |-
      创建一个提醒器
    messages:
      success: |-
          创建提醒器成功，编号为 {0}
      exist: |-
          已有相同的提醒器，编号为 {0}
      timeError: |-
          时间格式错误，请重新创建！
      typeError: |-
          提醒器类型错误，请重新创建！
      type: |-
        <p>请选择提醒器的类型，仅需回复数字：</p>
        <p>0：在指定时间提醒一次</p>
        <p>1：抽奖结束前一定时间提醒一次</p>
        <p>2：每隔一定时间提醒一次</p>
      specified: |-
        <p>请输入提醒的具体时间：</p>
        <p>格式：年-月-日-时-分</p>
        <p>当前时区：{0}</p>
      before-end: |-
        <p>请输入提醒距离抽奖结束的时间间隔：</p>
        <p>格式：年-月-日-时-分</p>
        <p>例如：0-0-0-1-30</p>
      interval:
        error: |-
          无效的选项！
        select: |-
          <p>你希望每过多久提醒一次？</p>
          <p>0：在 每年 的 某月某日某时某分</p>
          <p>1：在 每月 的 某日某时某分</p>
          <p>2：在 每天 的 某时某分</p>
          <p>3：在 每小时 的 某分</p>
        per-year: |-
          <p>你希望每年的什么时候提醒？</p>
          <p>格式：月-日-时-分</p>
          <p>当前时区：{0}</p>
        per-month: |-
          <p>你希望每月的什么时候提醒？</p>
          <p>格式：日-时-分</p>
          <p>当前时区：{0}</p>
        per-day: |-
          <p>你希望每天的什么时候提醒？</p>
          <p>格式：时-分</p>
          <p>当前时区：{0}</p>
        per-hour: |-
          <p>你希望每小时的什么时候提醒？</p>
          <p>格式：分</p>
          <p>当前时区：{0}</p>
  giveaway.reminder.delete:
    description: |-
      删除一个提醒器
    messages:
      success: |-
        删除提醒器成功！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      notYourReminder: |-
        你没有权限删除该提醒器！
  giveaway.reminder.list:
    description: |-
      查询提醒器列表
  giveaway.reminder.enable:
    description: |-
      启用一个提醒器
    messages:
      emptyRoll: |-
        未找到抽奖编号，请重新输入！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      rollEnd: |-
        该抽奖已结束，无法启用提醒器！
      noAuth: |-
        你没有权限启用提醒器！
      success: |-
        启用提醒器成功！
  giveaway.reminder.disable:
    description: |-
      禁用一个提醒
    messages:
      emptyRoll: |-
        未找到抽奖编号，请重新输入！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      rollEnd: |-
        该抽奖已结束，无需禁用提醒。
      noAuth: |-
        你没有权限禁用提醒器！
      success: |-
        禁用提醒器成功！
  giveaway.debug.honor:
    description: |-
      诊断当前群的荣誉接口（管理员）
    messages:
      noAuth: |-
        你没有权限使用该指令！
      groupOnly: |-
        请在群聊中使用该指令。
  giveaway.debug.member:
    description: |-
      诊断群成员信息接口（管理员）
    messages:
      noAuth: |-
        你没有权限使用该指令！
      groupOnly: |-
        请在群聊中使用该指令。
events:
  join.rejected: |-
    <quote id={messageId}/> 你不符合本次抽奖的参与条件：{reason}
  join.never-spoke: |-
    从未在群内发言
  join.days-ago: |-
    {0} 天前
  join.honor:
    fire7: |-
      群聊之火（连续发言 7 天）
    fire30: |-
      群聊炽焰（连续发言 30 天）
    dragon: |-
      龙王（昨日群聊最活跃）
  join.reason:
    level: |-
      群聊等级不足（你当前 {current} 级，本抽奖要求 {required} 级以上）
    active: |-
      最近 {required} 天内没有发言记录（你上次发言：{last}）
    honor: |-
      缺少所需的互动标识（需要：{required}）
    unavailable: |-
      暂时无法获取你的群成员信息，请稍后再试或联系管理员
  join.error: |-
    <quote id={messageId}/> 加入遇到错误，请再次发送口令。
  roll.add:
    success: |-
      <quote id={messageId}/> 成功加入编号为 {rollCode} 的抽奖。
    failed: |-
      <quote id={messageId}/> 您已加入编号为 {rollCode} 的抽奖，无需重复加入。
  roll.end:
    success: |-
      <quote id={messageId}/> 成功退出编号为 {rollCode} 的抽奖。
    failed: |-
      <quote id={messageId}/> 您未加入编号为 {rollCode} 的抽奖。
  remind.broadcast:
    message: |-
      <p>编号为 {rollCode} 的抽奖正在进行中~</p>
    messageWithDiff: |-
      <p>编号为 {rollCode} 的抽奖还有 {diff} 就要结束啦~</p>

