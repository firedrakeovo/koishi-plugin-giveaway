_config:
  basic:
    $description: |-
      Basic Settings
    cacheHours: |-
      <p>How long (in hours) a giveaway record is kept after it has been drawn.</p>
      <p>Older records are cleaned up automatically. Defaults to 72 hours.</p>
    defaultTimeOffset: |-
      <p>Default timezone offset for users who have not set their own.</p>
      <p>Enter the difference between local time and UTC, e.g. <code>+8</code>, <code>-9:30</code>, <code>-00:25:21</code>.</p>
  permission:
    $description: |-
      Permissions
    authorityCreate: |-
      <p>Minimum authority level required to create a giveaway. Defaults to 1 (regular users).</p>
      <p>Koishi authority levels: <code>0</code> banned, <code>1</code> user, <code>3</code> admin, <code>4</code> root. Change them with <code>admin user.authorize &lt;level&gt;</code> or from the console user page.</p>
      <p>Group owners and group admins can always create giveaways.</p>
    authorityManage: |-
      <p>Minimum authority level required to manage <b>someone else's</b> giveaway (delete, draw manually, manage reminders). Defaults to 3 (admin).</p>
      <p>The creator can always manage their own giveaway.</p>
    allowGuildAdminDelete: |-
      <p>Allow <b>group owners and group admins</b> to delete giveaways in their group.</p>
      <p>When disabled, only the creator and users at or above the management level can delete.</p>
    allowGuildAdminEnd: |-
      <p>Allow <b>group owners and group admins</b> to draw giveaways in their group manually.</p>
      <p>When disabled, only the creator and users at or above the management level can draw.</p>
  join:
    $description: |-
      Join Requirements
    minGroupLevel: |-
      <p>Minimum <b>group level</b> (QQ group chat level, 1-100) required to join a giveaway.</p>
      <p><code>0</code> means no restriction; e.g. <code>40</code> only lets members at level 40 or above join.</p>
      <p>Data comes from OneBot <code>get_group_member_info</code> (the <code>level</code> field).</p>
    minActiveDays: |-
      <p>Require the member to have spoken in this group within the last N days. <code>0</code> means no restriction.</p>
      <p>Data comes from <code>last_sent_time</code> of <code>get_group_member_info</code>. It does not depend on QQ's web API, so it is more reliable than the honors below and makes a good fallback.</p>
    minContinuousDays: |-
      <p>Require the member's <b>longest streak of consecutive days</b> with messages in this group to be at least this value (<code>0</code> means no restriction).</p>
      <p>The value comes from <code>day_count_max</code> of the QQ group honor API — the same source as the official "group fire (7 days)" / "group blaze (30 days)" honors, but with a custom threshold.</p>
      <p>Note: QQ only lists members whose streak is 7 days or more, so thresholds below <code>7</code> are unreliable; combine it with "recent activity" above to also require that the member is still active.</p>
    requiredHonors:
      $description: |-
        <p>Require the member to hold the selected QQ group <b>interaction honors</b>. Multiple choices allowed; empty means no restriction.</p>
        <p>Data comes from OneBot <code>get_group_honor_info</code>:</p>
        <ul>
          <li><b>Group fire:</b> spoke for 7 consecutive days (<code>performer_list</code>)</li>
          <li><b>Group blaze:</b> spoke for 30 consecutive days (<code>legend_list</code>)</li>
          <li><b>Dragon King:</b> most active in the group yesterday (<code>talkative_list</code>)</li>
        </ul>
        <p>Members holding the blaze honor no longer appear in the fire list; the plugin treats blaze as satisfying the 7-day condition. This API goes through qun.qq.com, so it is slower and may fail; results are cached for the configured duration.</p>
      $inner:
        - Group fire (7 consecutive days)
        - Group blaze (30 consecutive days)
        - Dragon King (most active yesterday)
    honorMode:
      $description: |-
        When several honors are selected, whether any one of them is enough or all of them are required. This is console-only and applies to every giveaway (the "Conditions" line never contains it).
      $inner:
        - Any of them
        - All of them
    dragonScope:
      $description: |-
        <p>How the "Dragon King" honor is matched:</p>
        <ul>
          <li><b>Yesterday's board:</b> anyone on the list qualifies (default, looser)</li>
          <li><b>Current Dragon King only:</b> only the single top member (stricter)</li>
        </ul>
      $inner:
        - Yesterday's board
        - Current Dragon King only
    onFetchError:
      $description: |-
        <p>What to do when member / honor data cannot be fetched (QQ API timeout, expired cookies, ...).</p>
        <p><b>Allow:</b> skip the conditions that could not be fetched and let the member join (recommended, avoids blocking legitimate users); <b>Deny:</b> ask the member to try again later.</p>
      $inner:
        - Allow
        - Deny
    cacheMinutes: |-
      How long (in minutes) honor data is cached. <code>0</code> means fetch every time.
  remind:
    $description: |-
      Reminders
    defaultReminders:
      $description: |-
        <p>Reminders enabled by default when a giveaway is created.</p>
        <p><b>type</b> — kind of reminder:</p>
        <ul>
          <li><b>Scheduled</b>: remind once at a given moment</li>
          <li><b>Before end</b>: remind a given time before the giveaway ends</li>
        </ul>
        <p><b>value</b> — time or interval, formatted as <b>year-month-day-hour-minute</b> (pad unused parts with 0)</p>
      value: |-
        Format: year-month-day-hour-minute
      type:
        $inner:
          - Scheduled
          - Before end
commands:
  timeout: |-
    输入超时
  giveaway:
    description: |-
      Giveaway commands
  giveaway.help:
    description: |-
      Show the command list
    item: "    {0}  {1}"
    groups:
      join: '[Join]'
      manage: '[Create & manage]'
      settings: '[Settings]'
      admin: '[Admin]'
    messages:
      help: |-
        <p>Giveaway commands (prefix with "giveaway"; sending "giveaway" alone shows this list):</p>
      footer: |-
        <p>The detail message shows the conditions in effect; you can also join by sending the giveaway's join key in the group.</p>
        <p>Docs: <a>https://github.com/firedrakeovo/koishi-plugin-giveaway</a></p>
  giveaway.channel:
    description: |-
      获取当前频道的频道id
    messages:
      result: |-
        当前频道id为：{0}
  giveaway.add:
    description: |-
      Create a giveaway: the bot sends a template, copy it, fill it in and send it back
    options:
      title: |-
        Custom giveaway title (defaults to "{0}'s giveaway")
      description: |-
        Custom giveaway description (defaults to the title)
      repeat: |-
        Allow the same member to win more than once (disabled by default)
    messages:
      noAuth: |-
        You are not allowed to create giveaways.
      defaultTitle: |-
        {0}'s giveaway
      defaultDescription: |-
        {0}'s giveaway
      success: |-
        Giveaway created, code {0}
      successWithKey: |-
        Giveaway created, code {0}; join key: {1}
      policyError: |-
        Unrecognised conditions: {0} (please follow the template format)
      createForm: |-
        Copy the template below, fill in each item and send it back (leave an item empty to skip it):
        Prizes:
        End time:
        Join key:
        Title:
        Description:
        Conditions: {0}
        Note 1: prizes use "name*amount", separate several with a comma or space; end time uses year-month-day-hour-minute, leave it empty for no auto-draw.
        Note 2: the "Conditions" line may be kept as is (use the console config), emptied (no restrictions for this giveaway), or rewritten as "Level≥40 Active≥1 Streak≥7 Honors=blaze,dragon" (delete whatever you do not need). The multi-honor mode and the Dragon King scope are set in the console.
      noPrize: |-
        No "Prizes:" line found, the giveaway cannot be created.
      prizeEmpty: |-
        Prizes cannot be empty.
      timeError: |-
        Invalid end time: use year-month-day-hour-minute, or leave it empty for no auto-draw.
      cancelled: |-
        Creation cancelled; just send "创建抽奖" again when needed.
      quit: |-
        Creation cancelled.
  giveaway.delete:
    description: |-
      手动删除一个抽奖
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
      noAuth: |-
        你没有权限删除该抽奖！
      success: |-
        删除了抽奖 {0}
  giveaway.end:
    description: |-
      手动进行开奖
    messages:
      wait:
        header: |-
          <p>当前你创建的抽奖如下：</p>
        body:
          rollList: |-
            <p>[{roll_code}] {title}</p>
        footer: |-
          <p>请输入要开奖的抽奖编号：</p>
      noAuth: |-
        你没有权限进行开奖！
      isEnd: |-
        该抽奖已开奖！
      notFound: |-
        没有找到该抽奖！
  giveaway.list:
    description: |-
      查询指定频道内的抽奖
  giveaway.detail:
    description: |-
      查询指定抽奖的详细描述
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
  giveaway.member:
    description: |-
      查询指定抽奖的参与成员
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
  giveaway.join:
    description: |-
      加入指定的抽奖
    messages:
      failed: |-
        找不到此抽奖！
      empty: |-
        请输入抽奖编号！
  giveaway.quit:
    description: |-
      退出指定的抽奖
    messages:
      failed: |-
        找不到此抽奖！
      empty: |-
        请输入抽奖编号！
  giveaway.time:
    description: |-
      修改时区
    messages:
      inValidFormat: |-
        请输入正确的时区偏移值格式！
      noAuth: |-
        你没有修改的权限！
      empty: |-
        无
      selected: |-
        使用此时区
      result: |-
        <p>当前时区设置：</p>
        <p> - 频道时区：{0}</p>
        <p> - 你的时区：{1}</p>
        <p> - 默认时区：{2}</p>
      success:
        channel: |-
          修改成功，频道当前的时区为 UTC{0}。
        user: |-
          修改成功，你当前的时区为 UTC{0}。
        defaultChannel: |-
          已清除频道时区设置
        defaultUser: |-
          已清除你的时区设置
  giveaway.locale:
    description: |-
      修改语言偏好
    messages:
      inValidFormat: |-
        请输入正确的语言偏好格式！
      noAuth: |-
        你没有修改的权限！
      empty: |-
        无
      selected: |-
        使用此语言偏好
      result: |-
        <p>当前语言偏好设置：</p>
        <p> - 频道语言偏好：{0}</p>
        <p> - 你的语言偏好：{1}</p>
        <p> - 默认语言偏好：{2}</p>
      success:
        channel: |-
          修改成功，频道当前的语言偏好为 {0}。
        user: |-
          修改成功，你当前的语言偏好为 {0}。
        defaultChannel: |-
          已清除频道语言偏好设置
        defaultUser: |-
          已清除你的语言偏好设置
  giveaway.remind:
    description: |-
      查询抽奖启用的提醒
    messages:
      notFound: |-
        没有找到该抽奖！

  giveaway.reminder:
    description: |-
      Giveaway 提醒功能
  giveaway.reminder.add:
    description: |-
      创建一个提醒器
    messages:
      success: |-
        创建提醒器成功，编号为 {0}
      exist: |-
        已有相同的提醒器，编号为 {0}
      timeError: |-
        时间格式错误，请重新创建！
      typeError: |-
        提醒器类型错误，请重新创建！
      type: |-
        <p>请选择提醒器的类型，仅需回复数字：</p>
        <p>0：在指定时间提醒一次</p>
        <p>1：抽奖结束前一定时间提醒一次</p>
        <p>2：每隔一定时间提醒一次</p>
      specified: |-
        <p>请输入提醒的具体时间：</p>
        <p>格式：年-月-日-时-分</p>
        <p>当前时区：{0}</p>
      before-end: |-
        <p>请输入提醒距离抽奖结束的时间间隔：</p>
        <p>格式：年-月-日-时-分</p>
        <p>例如：0-0-0-1-30</p>
      interval:
        error: |-
          无效的选项！
        select: |-
          <p>你希望每过多久提醒一次？</p>
          <p>0：在 每年 的 某月某日某时某分</p>
          <p>1：在 每月 的 某日某时某分</p>
          <p>2：在 每天 的 某时某分</p>
          <p>3：在 每小时 的 某分</p>
        per-year: |-
          <p>你希望每年的什么时候提醒？</p>
          <p>格式：月-日-时-分</p>
          <p>当前时区：{0}</p>
        per-month: |-
          <p>你希望每月的什么时候提醒？</p>
          <p>格式：日-时-分</p>
          <p>当前时区：{0}</p>
        per-day: |-
          <p>你希望每天的什么时候提醒？</p>
          <p>格式：时-分</p>
          <p>当前时区：{0}</p>
        per-hour: |-
          <p>你希望每小时的什么时候提醒？</p>
          <p>格式：分</p>
          <p>当前时区：{0}</p>
  giveaway.reminder.delete:
    description: |-
      删除一个提醒器
    messages:
      success: |-
        删除提醒器成功！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      notYourReminder: |-
        你没有权限删除该提醒器！
  giveaway.reminder.list:
    description: |-
      查询提醒器列表
  giveaway.reminder.enable:
    description: |-
      启用一个提醒器
    messages:
      emptyRoll: |-
        未找到抽奖编号，请重新输入！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      rollEnd: |-
        该抽奖已结束，无法启用提醒器！
      noAuth: |-
        你没有权限启用提醒器！
      success: |-
        启用提醒器成功！
  giveaway.reminder.disable:
    description: |-
      禁用一个提醒
    messages:
      emptyRoll: |-
        未找到抽奖编号，请重新输入！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      rollEnd: |-
        该抽奖已结束，无需禁用提醒。
      noAuth: |-
        你没有权限禁用提醒器！
      success: |-
        禁用提醒器成功！
  giveaway.debug.honor:
    description: |-
      Diagnose the group honor APIs (admin only)
    messages:
      noAuth: |-
        You are not allowed to use this command.
      groupOnly: |-
        Please use this command in a group.
  giveaway.debug.member:
    description: |-
      Diagnose the group member API (admin only)
    messages:
      noAuth: |-
        You are not allowed to use this command.
      groupOnly: |-
        Please use this command in a group.
events:
  join.rejected: |-
    <quote id={messageId}/> You do not meet the requirements of this giveaway: {reason}
  join.never-spoke: |-
    never spoke in this group
  join.days-ago: |-
    {0} days ago
  join.honor:
    fire7: |-
      group fire (7 consecutive days)
    fire30: |-
      group blaze (30 consecutive days)
    dragon: |-
      Dragon King (most active yesterday)
  join.reason:
    level: |-
      group level too low (you are level {current}, this giveaway requires level {required} or above)
    active: |-
      no messages within the last {required} days (your last message: {last})
    continuous: |-
      consecutive-days streak too short (your longest streak is {current} days, this giveaway requires at least {required})
    honor: |-
      missing required interaction honors (required: {required})
    unavailable: |-
      your group member information is temporarily unavailable, please try again later or contact an admin
  join.error: |-
    <quote id={messageId}/> Failed to join, please send the join key again.
  roll.add:
    success: |-
      <quote id={messageId}/> 成功加入编号为 {rollCode} 的抽奖。
    failed: |-
      <quote id={messageId}/> 您已加入编号为 {rollCode} 的抽奖，无需重复加入。
  roll.end:
    success: |-
      <quote id={messageId}/> 成功退出编号为 {rollCode} 的抽奖。
    failed: |-
      <quote id={messageId}/> 您未加入编号为 {rollCode} 的抽奖。
  remind.broadcast:
    message: |-
      <p>编号为 {rollCode} 的抽奖正在进行中~</p>
    messageWithDiff: |-
      <p>编号为 {rollCode} 的抽奖还有 {diff} 就要结束啦~</p>

