      <p>Giveaway {0} has ended!</p>
      <p>Congratulations to:</p>
    body:
      winner: |-
        <p><at id={userId}/> ({userId}) won:</p>
      winList: |-
        <p> - {name} * {amount}</p>
  roll.remind:
