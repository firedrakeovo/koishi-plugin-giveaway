      specified: |-
        Remind once at {timeDescription}
      beforeEnd: |-
        Remind once {timeDescription} before the giveaway ends
      interval: |-
        Remind every {intervalDescription}
      year: |-
        {0} year(s)
      month: |-
        {0} month(s)
      day: |-
        {0} day(s)
      hour: |-
        {0} hour(s)
      minute: |-
        {0} minute(s)
