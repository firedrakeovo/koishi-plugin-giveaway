      prizeTitle: |-
        <p>Prizes:</p>
      prizeListItem: |-
        <p>{name} * {amount}</p>
      winnerTitle: |-
        <p>Winners:</p>
      winner: |-
        <p>{userName} ({userId}) won:</p>
      winList: |-
        <p> - {name} * {amount}</p>
  roll.member:
    empty: |-
      This giveaway has no members yet!
    header: |-
      <p>{0} member(s) joined giveaway {1}:</p>
