_config:
  basic:
    $description: |-
      Grundeinstellungen
    cacheHours: |-
      <p>Wie lange (in Stunden) ein Verlosungseintrag nach der Ziehung aufbewahrt wird.</p>
      <p>Ältere Einträge werden automatisch gelöscht. Standard: 72 Stunden.</p>
    defaultTimeOffset: |-
      <p>Standard-Zeitzonenversatz für Nutzer, die keinen eigenen eingestellt haben.</p>
      <p>Differenz zwischen lokaler Zeit und UTC, z. B. <code>+8</code>, <code>-9:30</code>, <code>-00:25:21</code>.</p>
  permission:
    $description: |-
      Berechtigungen
    authorityCreate: |-
      <p>Mindestrang zum Erstellen einer Verlosung. Standard: 1 (normale Nutzer).</p>
      <p>Koishi-Ränge: <code>0</code> gesperrt, <code>1</code> Nutzer, <code>3</code> Administrator, <code>4</code> Superadministrator. Änderbar mit <code>admin user.authorize &lt;Rang&gt;</code> oder über die Nutzerseite der Konsole.</p>
      <p>Gruppeneigentümer und Gruppenadministratoren dürfen immer erstellen.</p>
    authorityManage: |-
      <p>Mindestrang, um <b>fremde</b> Verlosungen zu verwalten (löschen, manuell ziehen, Erinnerungen verwalten). Standard: 3 (Administrator).</p>
      <p>Der Ersteller darf seine eigene Verlosung immer verwalten.</p>
    allowGuildAdminDelete: |-
      <p><b>Gruppeneigentümer und -administratoren</b> dürfen Verlosungen ihrer Gruppe löschen.</p>
      <p>Wenn deaktiviert, dürfen nur der Ersteller und Nutzer ab dem Verwaltungsrang löschen.</p>
    allowGuildAdminEnd: |-
      <p><b>Gruppeneigentümer und -administratoren</b> dürfen Verlosungen ihrer Gruppe manuell ziehen.</p>
      <p>Wenn deaktiviert, dürfen nur der Ersteller und Nutzer ab dem Verwaltungsrang ziehen.</p>
  join:
    $description: |-
      Teilnahmebedingungen
    minGroupLevel: |-
      <p>Mindest-<b>Gruppenlevel</b> (QQ-Gruppenchat-Level, 1-100), um an einer Verlosung teilzunehmen.</p>
      <p><code>0</code> bedeutet keine Einschränkung; z. B. lässt <code>40</code> nur Mitglieder ab Level 40 teilnehmen.</p>
      <p>Daten stammen aus OneBot <code>get_group_member_info</code> (Feld <code>level</code>).</p>
    minActiveDays: |-
      <p>Das Mitglied muss innerhalb der letzten N Tage in dieser Gruppe geschrieben haben. <code>0</code> bedeutet keine Einschränkung.</p>
      <p>Daten stammen aus <code>last_sent_time</code> von <code>get_group_member_info</code>. Sie hängen nicht von der QQ-Web-API ab, sind also zuverlässiger als die Ehrungen unten, und eignen sich als Fallback.</p>
    minContinuousDays: |-
      <p>Verlangt, dass die <b>längste Serie aufeinanderfolgender Tage</b> mit Nachrichten in dieser Gruppe mindestens diesem Wert entspricht (<code>0</code> = keine Einschränkung).</p>
      <p>Der Wert stammt aus <code>day_count_max</code> der QQ-Gruppen-Ehrungs-API – dieselbe Quelle wie „Gruppenfeuer (7 Tage)“ / „Gruppenflamme (30 Tage)“, jedoch mit eigener Schwelle.</p>
      <p>Hinweis: QQ listet nur Mitglieder mit einer Serie ab 7 Tagen, Schwellen unter <code>7</code> sind daher unzuverlässig; kombiniere sie mit „letzte Aktivität“ oben.</p>
    requiredHonors:
      $description: |-
        <p>Das Mitglied muss die gewählten QQ-Gruppen-<b>Interaktionsabzeichen</b> besitzen. Mehrfachauswahl möglich; leer bedeutet keine Einschränkung.</p>
        <p>Daten stammen aus OneBot <code>get_group_honor_info</code>:</p>
        <ul>
          <li><b>Gruppenfeuer:</b> 7 Tage in Folge geschrieben (<code>performer_list</code>)</li>
          <li><b>Gruppenflamme:</b> 30 Tage in Folge geschrieben (<code>legend_list</code>)</li>
          <li><b>Drachenkönig:</b> gestern am aktivsten (<code>talkative_list</code>)</li>
        </ul>
        <p>Wer die Flamme besitzt, erscheint nicht mehr in der Feuer-Liste; das Plugin wertet die Flamme als Erfüllung der 7-Tage-Bedingung. Diese API läuft über qun.qq.com, ist langsamer und kann fehlschlagen; Ergebnisse werden für die eingestellte Dauer zwischengespeichert.</p>
      $inner:
        - Gruppenfeuer (7 Tage in Folge)
        - Gruppenflamme (30 Tage in Folge)
        - Drachenkönig (gestern am aktivsten)
    honorMode:
      $description: |-
        Ob bei mehreren gewählten Abzeichen eines genügt oder alle erfüllt sein müssen. Gilt nur hier in der Konsole für alle Verlosungen (die Zeile „Bedingungen“ enthält das nie).
      $inner:
        - Eines genügt
        - Alle erforderlich
    dragonScope:
      $description: |-
        <p>Wie der „Drachenkönig“ gewertet wird:</p>
        <ul>
          <li><b>Liste von gestern:</b> wer auf der Liste steht, qualifiziert sich (Standard, lockerer)</li>
          <li><b>Nur aktueller Drachenkönig:</b> nur der Erste der Liste (strenger)</li>
        </ul>
      $inner:
        - Liste von gestern
        - Nur aktueller Drachenkönig
    onFetchError:
      $description: |-
        <p>Verhalten, wenn Mitglieds-/Ehrungsdaten nicht abgerufen werden können (QQ-API-Timeout, abgelaufene Cookies, ...).</p>
        <p><b>Zulassen:</b> nicht abrufbare Bedingungen überspringen und beitreten lassen (empfohlen); <b>Ablehnen:</b> das Mitglied bitten, es später erneut zu versuchen.</p>
      $inner:
        - Zulassen
        - Ablehnen
    cacheMinutes: |-
      Wie lange (in Minuten) Ehrungsdaten zwischengespeichert werden. <code>0</code> bedeutet jedes Mal neu abrufen.
  render:
    $description: |-
      Bild-Rendering (optional)
    banner: |-
      <p>Optionales <b>Titelbild</b> über dem Kartenkopf (leer = ausblenden).</p>
      <p>Akzeptiert http(s)-URL, <code>data:</code>-Inline-Bild, <code>file:</code>-URL oder einen lokalen absoluten Pfad (wird zu file://).</p>
    style:
      $description: |-
        <p>Visueller Stil der gerenderten Karten.</p>
        <ul>
          <li><b>Standard:</b> Koishi-Verlauf in Blau-Violett, klare Karte</li>
          <li><b>Anime:</b> Sakura-Rosa / Lavendel, runde Formen, niedliche Symbole und Glitzer</li>
          <li><b>Gotisch:</b> Mitternachtsschwarz + Blutrot + Altgold, Serifenschrift, Goldlinien und Wappenornamente</li>
          <li><b>Ave Mujica:</b> Dunkelviolett-Schwarz + Rosenpink + Gotikgold, Maskenball-Stimmung (🎭🌹, römische Ziffern)</li>
        </ul>
      $inner:
        - Standard
        - Anime
        - Gotisch
        - Ave Mujica
    create: |-
      <p>Nach dem Erstellen einer Verlosung deren Inhalt (Nummer / Titel / Beschreibung / Endzeit / Beitrittswort / Preise / Bedingungen) als Bild rendern.</p>
      <p>Erfordert installiertes und aktiviertes <code>koishi-plugin-puppeteer</code>; ohne dieses (oder bei Fehlern) wird nur die Textnachricht gesendet.</p>
    avatar: |-
      <p>Im Ergebnisbild <b>Avatar und Nickname</b> der Gewinner anzeigen (Avatar über die QQ-Nummer via qlogo, Nickname aus dem OneBot-Profil).</p>
      <p>Ohne Profil wird nur die QQ-Nummer gezeigt, bei fehlgeschlagenem Avatar der Anfangsbuchstabe.</p>
    list: |-
      <p>Die Verlosungsliste als Bild rendern.</p>
      <p>Erfordert installiertes und aktiviertes <code>koishi-plugin-puppeteer</code>; ohne dieses oder bei Fehlern wird automatisch eine Textnachricht gesendet.</p>
    result: |-
      <p>Das Ziehungsergebnis (Gewinner und Preise) als Bild rendern, zusätzlich eine Textzeile mit @-Erwähnung der Gewinner.</p>
      <p>Erfordert installiertes und aktiviertes <code>koishi-plugin-puppeteer</code>; ohne dieses oder bei Fehlern wird die reine Textnachricht gesendet.</p>
  remind:
    $description: |-
      Ziehungs-Erinnerungen
    rules:
      $description: |-
        <p>Erinnerungsregeln nach der Vorlaufzeit gestaffelt: Jede Zeile ist eine Zeitobergrenze plus Erinnerungsposition (Prozent der verbleibenden Zeit).</p>
        <p>Eine Verlosung trifft nur die Zeile mit der <b>kleinsten Obergrenze, die noch >= ihrer eigenen Dauer</b> ist; standardmäßig wird also einmal erinnert. Mehrere Prozentwerte in einer Zeile (z. B. <code>20,10</code>) erinnern entsprechend öfter.</p>
        <p>Beispiel: <code>1h -&gt; 20%</code> erinnert eine Verlosung, die weniger als 1 Stunde vor der Ziehung erstellt wurde, 12 Minuten vorher; <code>5h -&gt; 15%</code> erinnert eine 1-5 Stunden lange Verlosung 45 Minuten vorher.</p>
        <p>Gilt nur für Verlosungen mit Endzeit; eine leere Tabelle deaktiviert die Erinnerungen. Text z. B. „Verlosung X endet in ...“.</p>
      maxDuration: |-
        Zeitobergrenze: 30m / 1h / 5h / 1d / 7d; 0 oder leer = unbegrenzt (Fallback-Zeile)
      percent: |-
        Erinnerungsposition: Prozent der verbleibenden Zeit (20 = 20% vor der Ziehung); mehrere durch Komma trennen (20,10)

commands:
  timeout: |-
    Zeitüberschreitung bei der Eingabe
  giveaway:
    description: |-
      Giveaway-Befehle
  giveaway.help:
    description: |-
      Befehlsliste anzeigen
    item: "    {0}  {1}"
    groups:
      join: '[Mitmachen]'
      manage: '[Erstellen & Verwalten]'
      settings: '[Einstellungen]'
      admin: '[Admin]'
    messages:
      help: |-
        <p>Giveaway-Befehle (Präfix „giveaway“; ein alleiniges „giveaway“ zeigt diese Liste):</p>
      footer: |-
        <p>Die Detailnachricht zeigt die geltenden Bedingungen; der Beitritt ist auch über das Beitrittswort in der Gruppe möglich.</p>
        <p>Doku: <a>https://github.com/firedrakeovo/koishi-plugin-giveaway</a></p>
  giveaway.channel:
    description: |-
      Aktuelle Kanal-ID anzeigen
    messages:
      result: |-
        Aktuelle Kanal-ID: {0}
  giveaway.add:
    description: |-
      Verlosung erstellen: der Bot sendet eine Vorlage, diese ausfüllen und zurücksenden
    options:
      title: |-
        Eigener Titel (Standard: „Verlosung von {0}“)
      description: |-
        Eigene Beschreibung (Standard: der Titel)
      repeat: |-
        Derselbe Gewinner darf mehrfach gezogen werden (standardmäßig aus)
    messages:
      noAuth: |-
        Du darfst keine Verlosungen erstellen.
      defaultTitle: |-
        Verlosung von {0}
      defaultDescription: |-
        Verlosung von {0}
      success: |-
        Verlosung erstellt, Nummer {0}
      successWithKey: |-
        Verlosung erstellt, Nummer {0}; Beitrittswort: {1}
      policyError: |-
        Bedingungen nicht erkennbar: {0} (bitte die Vorlage beachten)
      createForm: |-
        Bitte die Vorlage unten kopieren, ausfüllen und zurücksenden (leere Felder werden übersprungen):
        Preise:
        Endzeit:
        Beitrittswort:
        Titel:
        Beschreibung:
        Bedingungen: {0}
        Hinweis 1: Preise im Format „Name*Anzahl“, mehrere mit Komma oder Leerzeichen trennen; Endzeit im Format Monat-Tag-Stunde-Minute oder Jahr-Monat-Tag-Stunde-Minute (z. B. 09-15-20-00 / 2026-09-15-20-00); leer = keine automatische Ziehung.
        Hinweis 2: Die Zeile „Bedingungen“ kann unverändert bleiben (Konsole-Einstellungen verwenden), geleert werden (keine Einschränkung für diese Verlosung) oder umgeschrieben werden, z. B. „Stufe≥40 Aktiv≥1 Serie≥7 Abzeichen=Flamme,Drachenkoenig“ (nicht Benötigtes löschen). Modus für mehrere Abzeichen und der Drachenkönig-Umfang werden in der Konsole eingestellt.
      noPrize: |-
        Keine Zeile „Preise:“ gefunden, die Verlosung kann nicht erstellt werden.
      prizeEmpty: |-
        Die Preise dürfen nicht leer sein.
      timeError: |-
        Ungültige Endzeit: Jahr-Monat-Tag-Stunde-Minute, oder leer lassen für keine automatische Ziehung.
      cancelled: |-
        Erstellung abgebrochen; bei Bedarf einfach erneut „giveaway add“ senden.
      quit: |-
        Erstellung abgebrochen.
  giveaway.delete:
    description: |-
      Eine Verlosung manuell löschen
    messages:
      empty: |-
        Bitte die Verlosungsnummer eingeben!
      notFound: |-
        Verlosung nicht gefunden!
      noAuth: |-
        Du darfst diese Verlosung nicht löschen!
      success: |-
        Verlosung {0} gelöscht
  giveaway.end:
    description: |-
      Eine Verlosung manuell ziehen
    messages:
      wait:
        header: |-
          <p>Deine erstellten Verlosungen:</p>
        body:
          rollList: |-
            <p>[{roll_code}] {title}</p>
        footer: |-
          <p>Gib die Nummer der zu ziehenden Verlosung ein:</p>
      noAuth: |-
        Du darfst diese Verlosung nicht ziehen!
      isEnd: |-
        Diese Verlosung wurde bereits gezogen!
      notFound: |-
        Verlosung nicht gefunden!
  giveaway.list:
    description: |-
      Verlosungen in diesem Kanal auflisten
  giveaway.detail:
    description: |-
      Details einer Verlosung anzeigen
    messages:
      empty: |-
        Bitte die Verlosungsnummer eingeben!
      notFound: |-
        Verlosung nicht gefunden!
  giveaway.member:
    description: |-
      Mitglieder einer Verlosung anzeigen
    messages:
      empty: |-
        Bitte die Verlosungsnummer eingeben!
      notFound: |-
        Verlosung nicht gefunden!
  giveaway.join:
    description: |-
      Einer Verlosung beitreten
    messages:
      failed: |-
        Verlosung nicht gefunden!
      empty: |-
        Bitte die Verlosungsnummer eingeben!
  giveaway.quit:
    description: |-
      Eine Verlosung verlassen
    messages:
      failed: |-
        Verlosung nicht gefunden!
      empty: |-
        Bitte die Verlosungsnummer eingeben!
  giveaway.time:
    description: |-
      Zeitzone ändern
    messages:
      inValidFormat: |-
        Bitte ein gültiges Zeitzonen-Format eingeben!
      noAuth: |-
        Du darfst das nicht ändern!
      empty: |-
        Keine
      selected: |-
        Diese Zeitzone verwenden
      result: |-
        <p>Aktuelle Zeitzonen-Einstellungen:</p>
        <p> - Kanal-Zeitzone: {0}</p>
        <p> - Deine Zeitzone: {1}</p>
        <p> - Standard-Zeitzone: {2}</p>
      success:
        channel: |-
          Geändert: die Kanal-Zeitzone ist jetzt UTC{0}.
        user: |-
          Geändert: deine Zeitzone ist jetzt UTC{0}.
        defaultChannel: |-
          Die Kanal-Zeitzonen-Einstellung wurde entfernt
        defaultUser: |-
          Deine Zeitzonen-Einstellung wurde entfernt
  giveaway.locale:
    description: |-
      Sprache ändern
    messages:
      inValidFormat: |-
        Bitte eine gültige Sprache eingeben!
      noAuth: |-
        Du darfst das nicht ändern!
      empty: |-
        Keine
      selected: |-
        Diese Sprache verwenden
      result: |-
        <p>Aktuelle Spracheinstellungen:</p>
        <p> - Kanal-Sprache: {0}</p>
        <p> - Deine Sprache: {1}</p>
        <p> - Standard-Sprache: {2}</p>
      success:
        channel: |-
          Geändert: die Kanal-Sprache ist jetzt {0}.
        user: |-
          Geändert: deine Sprache ist jetzt {0}.
        defaultChannel: |-
          Die Kanal-Spracheinstellung wurde entfernt
        defaultUser: |-
          Deine Spracheinstellung wurde entfernt
  giveaway.debug.honor:
    description: |-
      Gruppen-Ehrungs-APIs diagnostizieren (nur Admins)
    messages:
      noAuth: |-
        Du darfst diesen Befehl nicht verwenden.
      groupOnly: |-
        Bitte verwende diesen Befehl in einer Gruppe.
  giveaway.debug.member:
    description: |-
      Gruppenmitglieds-API diagnostizieren (nur Admins)
    messages:
      noAuth: |-
        Du darfst diesen Befehl nicht verwenden.
      groupOnly: |-
        Bitte verwende diesen Befehl in einer Gruppe.
events:
  join.rejected: |-
    <quote id={messageId}/> Du erfüllst die Bedingungen dieser Verlosung nicht: {reason}
  join.never-spoke: |-
    noch nie in dieser Gruppe geschrieben
  join.days-ago: |-
    vor {0} Tagen
  join.honor:
    fire7: |-
      Gruppenfeuer (7 Tage in Folge)
    fire30: |-
      Gruppenflamme (30 Tage in Folge)
    dragon: |-
      Drachenkönig (gestern am aktivsten)
  join.reason:
    level: |-
      Gruppenlevel zu niedrig (du bist Level {current}, diese Verlosung verlangt Level {required} oder höher)
    active: |-
      keine Nachricht in den letzten {required} Tagen (deine letzte Nachricht: {last})
    continuous: |-
      Serie aufeinanderfolgender Tage zu kurz (deine längste Serie: {current} Tage, erforderlich sind mindestens {required})
    honor: |-
      erforderliche Interaktionsabzeichen fehlen (erforderlich: {required})
    unavailable: |-
      deine Gruppenmitgliedsdaten sind derzeit nicht verfügbar, bitte versuche es später erneut oder wende dich an einen Admin
  join.error: |-
    <quote id={messageId}/> Beitritt fehlgeschlagen, bitte das Beitrittswort erneut senden.
  roll.add:
    success: |-
      <quote id={messageId}/> Der Verlosung {rollCode} erfolgreich beigetreten.
    failed: |-
      <quote id={messageId}/> Du bist der Verlosung {rollCode} bereits beigetreten.
  roll.end:
    success: |-
      <quote id={messageId}/> Die Verlosung {rollCode} erfolgreich verlassen.
    failed: |-
      <quote id={messageId}/> Du bist der Verlosung {rollCode} nicht beigetreten.
  remind.broadcast:
    message: |-
      <p>Die Verlosung {rollCode} läuft~</p>
    messageWithDiff: |-
      <p>Die Verlosung {rollCode} endet in {diff}~</p>

messageBuilder:
  render:
    eyebrow: |-
      VERLOSUNG
    list:
      channel: |-
        Kanal {0}
      title: |-
        Verlosungsliste
      summary: |-
        {0} laufend · {1} beendet
      marks:
        open: |-
          läuft
        ended: |-
          beendet
      deadline: |-
        endet {0}
      noDeadline: |-
        keine automatische Ziehung
      empty: |-
        In diesem Kanal gibt es noch keine Verlosung
    create:
      title: |-
        Verlosung erstellt
      summary: |-
        Nummer {0}
      deadline: |-
        Endet am
      description: |-
        Beschreibung
      key: |-
        Beitrittswort
      noKey: |-
        kein Wort (Beitritt über „giveaway join“ + Nummer)
      prizes: |-
        Preise
      conditions: |-
        Bedingungen
    result:
      title: |-
        Ziehungsergebnis
      summary: |-
        Verlosung {0} · {1} Gewinner
      noWinner: |-
        Diesmal gibt es keinen Gewinner
      prize: |-
        {0} × {1}
    footer: |-
      koishi-plugin-giveaway
  marks:
    open: |-
      [läuft]
    end: |-
      [beendet]
  roll.list:
    error: |-
      Keine Verlosung gefunden!
    header: |-
      <p>Verlosungsliste:</p>
    listItem: |-
      <p>[{roll_code}] {title}</p>
  roll.detail:
    noCondition: |-
      keine
    noEndTime: |-
      Keine
    divider: |-
      <p>---------</p>
    header: |-
      <p>{mark} [{roll_code}] {title}</p>
      <p>Endet am: {endTime}</p>
      <p>Beschreibung: {description}</p>
      <p>Bedingungen: {condition}</p>
    body:
      prizeTitle: |-
        <p>Preise:</p>
      prizeListItem: |-
        <p>{name} * {amount}</p>
      winnerTitle: |-
        <p>Gewinner:</p>
      winner: |-
        <p>{userName} ({userId}) gewinnt:</p>
      winList: |-
        <p> - {name} * {amount}</p>
  roll.member:
    empty: |-
      Diese Verlosung hat noch keine Teilnehmer!
    header: |-
      <p>{0} Mitglied(er) nehmen an der Verlosung {1} teil:</p>
    body:
      memberListItem: |-
        <p>{userName} ({userId})</p>
  roll.end:
    header: |-
      <p>Verlosung {0} ist beendet!</p>
      <p>Herzlichen Glückwunsch an:</p>
    body:
      winner: |-
        <p><at id={userId}/> ({userId}) gewinnt:</p>
      winList: |-
        <p> - {name} * {amount}</p>