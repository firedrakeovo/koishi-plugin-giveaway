_config:
  basic:
    $description: |-
      Grundeinstellungen
    cacheHours: |-
      <p>Wie lange (in Stunden) ein Verlosungseintrag nach der Ziehung aufbewahrt wird.</p>
      <p>Ältere Einträge werden automatisch gelöscht. Standard: 72 Stunden.</p>
    defaultTimeOffset: |-
      <p>Standard-Zeitzonenversatz für Nutzer, die keinen eigenen eingestellt haben.</p>
      <p>Differenz zwischen lokaler Zeit und UTC, z. B. <code>+8</code>, <code>-9:30</code>, <code>-00:25:21</code>.</p>
  permission:
    $description: |-
      Berechtigungen
    authorityCreate: |-
      <p>Mindestrang zum Erstellen einer Verlosung. Standard: 1 (normale Nutzer).</p>
      <p>Koishi-Ränge: <code>0</code> gesperrt, <code>1</code> Nutzer, <code>3</code> Administrator, <code>4</code> Superadministrator. Änderbar mit <code>admin user.authorize &lt;Rang&gt;</code> oder über die Nutzerseite der Konsole.</p>
      <p>Gruppeneigentümer und Gruppenadministratoren dürfen immer erstellen.</p>
    authorityManage: |-
      <p>Mindestrang, um <b>fremde</b> Verlosungen zu verwalten (löschen, manuell ziehen, Erinnerungen verwalten). Standard: 3 (Administrator).</p>
      <p>Der Ersteller darf seine eigene Verlosung immer verwalten.</p>
    allowGuildAdminDelete: |-
      <p><b>Gruppeneigentümer und -administratoren</b> dürfen Verlosungen ihrer Gruppe löschen.</p>
      <p>Wenn deaktiviert, dürfen nur der Ersteller und Nutzer ab dem Verwaltungsrang löschen.</p>
    allowGuildAdminEnd: |-
      <p><b>Gruppeneigentümer und -administratoren</b> dürfen Verlosungen ihrer Gruppe manuell ziehen.</p>
      <p>Wenn deaktiviert, dürfen nur der Ersteller und Nutzer ab dem Verwaltungsrang ziehen.</p>
  join:
    $description: |-
      Teilnahmebedingungen
    minGroupLevel: |-
      <p>Mindest-<b>Gruppenlevel</b> (QQ-Gruppenchat-Level, 1-100), um an einer Verlosung teilzunehmen.</p>
      <p><code>0</code> bedeutet keine Einschränkung; z. B. lässt <code>40</code> nur Mitglieder ab Level 40 teilnehmen.</p>
      <p>Daten stammen aus OneBot <code>get_group_member_info</code> (Feld <code>level</code>).</p>
    minActiveDays: |-
      <p>Das Mitglied muss innerhalb der letzten N Tage in dieser Gruppe geschrieben haben. <code>0</code> bedeutet keine Einschränkung.</p>
      <p>Daten stammen aus <code>last_sent_time</code> von <code>get_group_member_info</code>. Sie hängen nicht von der QQ-Web-API ab, sind also zuverlässiger als die Ehrungen unten, und eignen sich als Fallback.</p>
    requiredHonors:
      $description: |-
        <p>Das Mitglied muss die gewählten QQ-Gruppen-<b>Interaktionsabzeichen</b> besitzen. Mehrfachauswahl möglich; leer bedeutet keine Einschränkung.</p>
        <p>Daten stammen aus OneBot <code>get_group_honor_info</code>:</p>
        <ul>
          <li><b>Gruppenfeuer:</b> 7 Tage in Folge geschrieben (<code>performer_list</code>)</li>
          <li><b>Gruppenflamme:</b> 30 Tage in Folge geschrieben (<code>legend_list</code>)</li>
          <li><b>Drachenkönig:</b> gestern am aktivsten (<code>talkative_list</code>)</li>
        </ul>
        <p>Wer die Flamme besitzt, erscheint nicht mehr in der Feuer-Liste; das Plugin wertet die Flamme als Erfüllung der 7-Tage-Bedingung. Diese API läuft über qun.qq.com, ist langsamer und kann fehlschlagen; Ergebnisse werden für die eingestellte Dauer zwischengespeichert.</p>
      $inner:
        - Gruppenfeuer (7 Tage in Folge)
        - Gruppenflamme (30 Tage in Folge)
        - Drachenkönig (gestern am aktivsten)
    honorMode:
      $description: |-
        Ob bei mehreren gewählten Abzeichen eines genügt oder alle erfüllt sein müssen.
      $inner:
        - Eines genügt
        - Alle erforderlich
    onFetchError:
      $description: |-
        <p>Verhalten, wenn Mitglieds-/Ehrungsdaten nicht abgerufen werden können (QQ-API-Timeout, abgelaufene Cookies, ...).</p>
        <p><b>Zulassen:</b> nicht abrufbare Bedingungen überspringen und beitreten lassen (empfohlen); <b>Ablehnen:</b> das Mitglied bitten, es später erneut zu versuchen.</p>
      $inner:
        - Zulassen
        - Ablehnen
    cacheMinutes: |-
      Wie lange (in Minuten) Ehrungsdaten zwischengespeichert werden. <code>0</code> bedeutet jedes Mal neu abrufen.
  remind:
    $description: |-
      Erinnerungen
    defaultReminders:
      $description: |-
        <p>Erinnerungen, die beim Erstellen einer Verlosung standardmäßig aktiv sind.</p>
        <p><b>type</b> — Art der Erinnerung:</p>
        <ul>
          <li><b>Geplant</b>: einmal zu einem bestimmten Zeitpunkt erinnern</li>
          <li><b>Vor Ende</b>: eine bestimmte Zeit vor Ende der Verlosung erinnern</li>
        </ul>
        <p><b>value</b> — Zeit oder Intervall im Format <b>Jahr-Monat-Tag-Stunde-Minute</b> (nicht genutzte Teile mit 0 füllen)</p>
      value: |-
        Format: Jahr-Monat-Tag-Stunde-Minute
      type:
        $inner:
          - Geplant
          - Vor Ende
commands:
  timeout: |-
    输入超时
  giveaway:
    description: |-
      Giveaway 抽奖功能
  giveaway.help:
    description: |-
      显示 Giveaway 帮助信息
    messages:
      help: |-
        <p>帮助文档：</p>
        <a>https://github.com/firedrakeovo/koishi-plugin-giveaway</a>
  giveaway.channel:
    description: |-
      获取当前频道的频道id
    messages:
      result: |-
        当前频道id为：{0}
  giveaway.add:
    description: |-
      交互式地创建一个抽奖
    messages:
      noAuth: |-
        你没有权限创建抽奖！
      defaultTitle: |-
        {0} 的抽奖
      defaultDescription: |-
        {0} 的抽奖
      success: |-
        创建抽奖成功，编号为 {0}
      title: |-
        <p>请输入抽奖的标题：</p>
        <p>（回复 n 使用默认内容：{0} 的抽奖）</p>
      description: |-
        <p>请输入抽奖的描述：</p>
        <p>（回复 n 使用默认内容：{0} 的抽奖）</p>
      prize: |-
        <p>请输入你要抽的奖品：</p>
        <p>格式为 奖品名称*数量 (留空为1)，每行视为一个独立奖品。</p>
      autoEnd: |-
        <p>请输入自动开奖的时间：</p>
        <p>格式：年-月-日-时-分</p>
        <p>当前时区：{0}</p>
        <p>（回复 n 则不使用自动开奖）</p>
      timeError: |-
        时间格式错误，请重新创建！
      type: |-
        <p>请选择自动开奖的抽奖类型，仅需回复数字：</p>
        <p>0：中奖人可重复</p>
        <p>1：中奖人不可重复</p>
        <p>（回复 n 使用默认类型：1）</p>
      typeError: |-
        抽奖类型错误，请重新创建！
      joinKey: |-
        <p>请输入加入抽奖的口令，用户可以直接发送口令来加入抽奖：</p>
        <p>（回复 n 则不使用加入口令）</p>
  giveaway.delete:
    description: |-
      手动删除一个抽奖
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
      noAuth: |-
        你没有权限删除该抽奖！
      success: |-
        删除了抽奖 {0}
  giveaway.end:
    description: |-
      手动进行开奖
    messages:
      wait:
        header: |-
          <p>当前你创建的抽奖如下：</p>
        body:
          rollList: |-
            <p>[{roll_code}] {title}</p>
        footer: |-
          <p>请输入要开奖的抽奖编号：</p>
      noAuth: |-
        你没有权限进行开奖！
      isEnd: |-
        该抽奖已开奖！
      notFound: |-
        没有找到该抽奖！
  giveaway.list:
    description: |-
      查询指定频道内的抽奖
  giveaway.detail:
    description: |-
      查询指定抽奖的详细描述
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
  giveaway.member:
    description: |-
      查询指定抽奖的参与成员
    messages:
      empty: |-
        请输入抽奖编号！
      notFound: |-
        没有找到该抽奖！
  giveaway.join:
    description: |-
      加入指定的抽奖
    messages:
      failed: |-
        找不到此抽奖！
      empty: |-
        请输入抽奖编号！
  giveaway.quit:
    description: |-
      退出指定的抽奖
    messages:
      failed: |-
        找不到此抽奖！
      empty: |-
        请输入抽奖编号！
  giveaway.time:
    description: |-
      修改时区
    messages:
      inValidFormat: |-
        请输入正确的时区偏移值格式！
      noAuth: |-
        你没有修改的权限！
      empty: |-
        无
      selected: |-
        使用此时区
      result: |-
        <p>当前时区设置：</p>
        <p> - 频道时区：{0}</p>
        <p> - 你的时区：{1}</p>
        <p> - 默认时区：{2}</p>
      success:
        channel: |-
          修改成功，频道当前的时区为 UTC{0}。
        user: |-
          修改成功，你当前的时区为 UTC{0}。
        defaultChannel: |-
          已清除频道时区设置
        defaultUser: |-
          已清除你的时区设置
  giveaway.locale:
    description: |-
      修改语言偏好
    messages:
      inValidFormat: |-
        请输入正确的语言偏好格式！
      noAuth: |-
        你没有修改的权限！
      empty: |-
        无
      selected: |-
        使用此语言偏好
      result: |-
        <p>当前语言偏好设置：</p>
        <p> - 频道语言偏好：{0}</p>
        <p> - 你的语言偏好：{1}</p>
        <p> - 默认语言偏好：{2}</p>
      success:
        channel: |-
          修改成功，频道当前的语言偏好为 {0}。
        user: |-
          修改成功，你当前的语言偏好为 {0}。
        defaultChannel: |-
          已清除频道语言偏好设置
        defaultUser: |-
          已清除你的语言偏好设置
  giveaway.remind:
    description: |-
      查询抽奖启用的提醒
    messages:
      notFound: |-
        没有找到该抽奖！

  giveaway.reminder:
    description: |-
      Giveaway 提醒功能
  giveaway.reminder.add:
    description: |-
      创建一个提醒器
    messages:
      success: |-
        创建提醒器成功，编号为 {0}
      exist: |-
        已有相同的提醒器，编号为 {0}
      timeError: |-
        时间格式错误，请重新创建！
      typeError: |-
        提醒器类型错误，请重新创建！
      type: |-
        <p>请选择提醒器的类型，仅需回复数字：</p>
        <p>0：在指定时间提醒一次</p>
        <p>1：抽奖结束前一定时间提醒一次</p>
        <p>2：每隔一定时间提醒一次</p>
      specified: |-
        <p>请输入提醒的具体时间：</p>
        <p>格式：年-月-日-时-分</p>
        <p>当前时区：{0}</p>
      before-end: |-
        <p>请输入提醒距离抽奖结束的时间间隔：</p>
        <p>格式：年-月-日-时-分</p>
        <p>例如：0-0-0-1-30</p>
      interval:
        error: |-
          无效的选项！
        select: |-
          <p>你希望每过多久提醒一次？</p>
          <p>0：在 每年 的 某月某日某时某分</p>
          <p>1：在 每月 的 某日某时某分</p>
          <p>2：在 每天 的 某时某分</p>
          <p>3：在 每小时 的 某分</p>
        per-year: |-
          <p>你希望每年的什么时候提醒？</p>
          <p>格式：月-日-时-分</p>
          <p>当前时区：{0}</p>
        per-month: |-
          <p>你希望每月的什么时候提醒？</p>
          <p>格式：日-时-分</p>
          <p>当前时区：{0}</p>
        per-day: |-
          <p>你希望每天的什么时候提醒？</p>
          <p>格式：时-分</p>
          <p>当前时区：{0}</p>
        per-hour: |-
          <p>你希望每小时的什么时候提醒？</p>
          <p>格式：分</p>
          <p>当前时区：{0}</p>
  giveaway.reminder.delete:
    description: |-
      删除一个提醒器
    messages:
      success: |-
        删除提醒器成功！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      notYourReminder: |-
        你没有权限删除该提醒器！
  giveaway.reminder.list:
    description: |-
      查询提醒器列表
  giveaway.reminder.enable:
    description: |-
      启用一个提醒器
    messages:
      emptyRoll: |-
        未找到抽奖编号，请重新输入！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      rollEnd: |-
        该抽奖已结束，无法启用提醒器！
      noAuth: |-
        你没有权限启用提醒器！
      success: |-
        启用提醒器成功！
  giveaway.reminder.disable:
    description: |-
      禁用一个提醒
    messages:
      emptyRoll: |-
        未找到抽奖编号，请重新输入！
      emptyReminder: |-
        未找到提醒器编号，请重新输入！
      rollEnd: |-
        该抽奖已结束，无需禁用提醒。
      noAuth: |-
        你没有权限禁用提醒器！
      success: |-
        禁用提醒器成功！
events:
  join.rejected: |-
    <quote id={messageId}/> Du erfüllst die Bedingungen dieser Verlosung nicht: {reason}
  join.never-spoke: |-
    noch nie in dieser Gruppe geschrieben
  join.days-ago: |-
    vor {0} Tagen
  join.honor:
    fire7: |-
      Gruppenfeuer (7 Tage in Folge)
    fire30: |-
      Gruppenflamme (30 Tage in Folge)
    dragon: |-
      Drachenkönig (gestern am aktivsten)
  join.reason:
    level: |-
      Gruppenlevel zu niedrig (du bist Level {current}, diese Verlosung verlangt Level {required} oder höher)
    active: |-
      keine Nachricht in den letzten {required} Tagen (deine letzte Nachricht: {last})
    honor: |-
      erforderliche Interaktionsabzeichen fehlen (erforderlich: {required})
    unavailable: |-
      deine Gruppenmitgliedsdaten sind derzeit nicht verfügbar, bitte versuche es später erneut oder wende dich an einen Admin
  roll.add:
    success: |-
      <quote id={messageId}/> 成功加入编号为 {rollCode} 的抽奖。
    failed: |-
      <quote id={messageId}/> 您已加入编号为 {rollCode} 的抽奖，无需重复加入。
  roll.end:
    success: |-
      <quote id={messageId}/> 成功退出编号为 {rollCode} 的抽奖。
    failed: |-
      <quote id={messageId}/> 您未加入编号为 {rollCode} 的抽奖。
  remind.broadcast:
    message: |-
      <p>编号为 {rollCode} 的抽奖正在进行中~</p>
    messageWithDiff: |-
      <p>编号为 {rollCode} 的抽奖还有 {diff} 就要结束啦~</p>

